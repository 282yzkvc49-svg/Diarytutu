<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дневник</title>
<meta name="description" content="Личный дневник: записи дня, настроение, фото и аналитика — офлайн, данные только на устройстве.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Дневник">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f1f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121426" media="(prefers-color-scheme: dark)">
<style>
  /* ---------- Токены ---------- */
  @property --sky { syntax: '<color>'; inherits: true; initial-value: transparent; }
  :root {
    --bg: #f1f2f7; --surface: #ffffff; --surface-2: #e6e8f1; --ink: #1f2444; --muted: #5f6582;
    --line: #d9dce8; --danger: #b42318; --on-ink: #ffffff; --mark: #f6e3a1; --star: #c98a0b; --flag: #2b3a8c;
    --m1: #2b3a8c; --m2: #4f6cc0; --m3: #93aadb; --m4: #bdb9ae; --m5: #f1cf6e; --m6: #eaa83a; --m7: #db7a1f;
    --serif: ui-serif, "New York", "Iowan Old Style", "Charter", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
    --tap: 44px; --content: 760px; --radius: 16px;
    color-scheme: light;
  }
  /* Тёмная тема: по системе, если тема не выбрана явно, и при явном data-theme="dark" */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121426; --surface: #1a1d33; --surface-2: #252941; --ink: #e9eaf4; --muted: #a2a7c3;
      --line: #2f3452; --danger: #ff8a7a; --on-ink: #121426; --mark: #6b5a1c; --star: #f2c14e; --flag: #a6bbe7;
      --m1: #5465c9; --m2: #7590dc; --m3: #a6bbe7; --m4: #8f8c85; --m5: #e9c665; --m6: #e5a23a; --m7: #e9853a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
      --bg: #121426; --surface: #1a1d33; --surface-2: #252941; --ink: #e9eaf4; --muted: #a2a7c3;
      --line: #2f3452; --danger: #ff8a7a; --on-ink: #121426; --mark: #6b5a1c; --star: #f2c14e; --flag: #a6bbe7;
      --m1: #5465c9; --m2: #7590dc; --m3: #a6bbe7; --m4: #8f8c85; --m5: #e9c665; --m6: #e5a23a; --m7: #e9853a;
      color-scheme: dark;
  }

  /* ---------- База ---------- */
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; min-height: 100dvh;
    background: var(--bg); color: var(--ink);
    font: 17px/1.45 var(--sans);
    -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overscroll-behavior-y: none;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  input, select, textarea { font-size: max(16px, 1em); }
  button { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  [hidden] { display: none !important; }
  h1, h2, h3 { font-family: var(--serif); font-weight: 600; letter-spacing: -0.01em; margin: 0; }
  svg.i { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }

  /* ---------- Каркас ---------- */
  .app { min-height: 100dvh; }
  .nav {
    position: fixed; z-index: 20; left: 0; right: 0; bottom: 0;
    display: flex; justify-content: space-around;
    padding: 6px calc(8px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));
    background: color-mix(in srgb, var(--surface) 90%, transparent);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    border-top: 1px solid var(--line);
  }
  .nav .brand, .nav .nav-settings { display: none; }
  .nav button {
    flex: 1; max-width: 120px; min-height: 50px; border: 0; background: none; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    font-size: 11px; border-radius: 12px;
  }
  .nav button[aria-current="page"] { color: var(--ink); font-weight: 600; }
  .view {
    width: 100%; max-width: calc(var(--content) + 32px); margin: 0 auto;
    padding: calc(12px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  }
  .view.wide { max-width: 1120px; }
  .head { display: flex; align-items: center; gap: 10px; min-height: 48px; margin-bottom: 8px; }
  .head h1 { flex: 1; font-size: 30px; }
  @media (min-width: 900px) {
    .nav {
      top: 0; right: auto; width: 220px; flex-direction: column; justify-content: flex-start; gap: 4px;
      padding: calc(20px + env(safe-area-inset-top)) 12px calc(16px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
      border-top: 0; border-right: 1px solid var(--line);
    }
    .nav .brand { display: block; font: 600 24px var(--serif); padding: 4px 12px 18px; }
    .nav button { flex: none; max-width: none; min-height: 46px; flex-direction: row; justify-content: flex-start; gap: 12px; padding: 0 12px; font-size: 16px; }
    .nav button[aria-current="page"] { background: var(--surface-2); }
    .nav .nav-settings { display: flex; margin-top: auto; }
    .app { padding-left: 220px; }
    .view { padding-bottom: calc(40px + env(safe-area-inset-bottom)); }
    .settings-btn { display: none; }
    .sky { margin: 4px -12px 0; border-radius: 26px; padding: 26px 28px 24px; }
    .memories { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  }

  /* ---------- Кнопки, поля ---------- */
  .btn {
    min-height: var(--tap); min-width: var(--tap); padding: 0 16px; border: 0; border-radius: 12px;
    background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line);
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px;
  }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--ink); color: var(--on-ink); box-shadow: none; font-weight: 600; }
  .btn.ghost { background: none; box-shadow: none; }
  .btn.danger { color: var(--danger); }
  .btn.icon { padding: 0; width: var(--tap); }
  .btn.block { width: 100%; }
  .btn[aria-pressed="true"] { color: var(--ink); background: var(--surface-2); }
  .btn:disabled { opacity: .5; }
  .field {
    min-height: var(--tap); width: 100%; padding: 10px 14px; border: 1px solid var(--line);
    border-radius: 12px; background: var(--surface);
  }
  .field:focus { outline: 2px solid var(--ink); outline-offset: 0; }
  select.field { -webkit-appearance: none; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 36px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  .label { display: block; font-size: 15px; color: var(--muted); margin: 0 0 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink); font-size: 15px; display: inline-flex; align-items: center; gap: 6px;
  }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
  .chip .x { font-size: 18px; line-height: 1; opacity: .7; }
  .chip.static { cursor: default; }
  .seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; min-height: 38px; border: 0; background: none; border-radius: 9px; color: var(--muted); font-size: 15px; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgb(0 0 0 / .08); }

  .banner {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 0 0 16px; padding: 12px 14px;
    border-radius: 14px; background: var(--surface); border: 1px solid var(--line);
  }
  .banner p { flex: 1 1 240px; margin: 0; font-size: 15px; }
  .banner.demo { background: color-mix(in srgb, var(--m5) 30%, var(--surface)); border-color: color-mix(in srgb, var(--m6) 50%, var(--line)); }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 90;
    bottom: calc(88px + env(safe-area-inset-bottom));
    padding: 12px 18px; border-radius: 999px; background: var(--ink); color: var(--on-ink);
    opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90vw; font-size: 15px; text-align: center;
  }
  .toast.show { opacity: 1; }
  @media (min-width: 900px) { .toast { bottom: calc(28px + env(safe-area-inset-bottom)); left: calc(50% + 110px); } }

  dialog {
    width: min(500px, calc(100vw - 24px)); max-height: calc(100dvh - 40px); padding: 20px; border: 0; border-radius: 20px;
    background: var(--surface); color: var(--ink); overflow: auto;
  }
  dialog::backdrop { background: rgb(10 12 30 / .45); }
  dialog h2 { font-size: 22px; margin-bottom: 14px; }
  .stack { display: grid; gap: 12px; }
  .dlg-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; flex-wrap: wrap; }

  /* ---------- Настроение ---------- */
  .moods { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .mood {
    aspect-ratio: 1; min-height: 44px; max-height: 64px; border-radius: 50%; border: 0; background: var(--surface);
    box-shadow: inset 0 0 0 1px var(--line); font-size: clamp(22px, 6vw, 32px); line-height: 1; padding: 0;
    display: flex; align-items: center; justify-content: center; justify-self: center; width: 100%; max-width: 64px;
    transition: transform .15s;
  }
  .mood[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--mc), inset 0 0 0 30px color-mix(in srgb, var(--mc) 35%, var(--surface)); transform: scale(1.06); }
  .mood-caption { text-align: center; min-height: 22px; margin-top: 8px; font-size: 15px; color: var(--muted); }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex: none; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px 4px 6px; border-radius: 999px; background: color-mix(in srgb, var(--mc) 28%, var(--surface)); font-size: 15px; }
  .pill .e { font-size: 22px; }

  /* ---------- Сегодня ---------- */
  .sky {
    margin: calc(-12px - env(safe-area-inset-top)) calc(-16px - env(safe-area-inset-right)) 0 calc(-16px - env(safe-area-inset-left));
    padding: calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 20px calc(16px + env(safe-area-inset-left));
    background: linear-gradient(180deg, color-mix(in srgb, var(--sky) 55%, var(--bg)) 0%, color-mix(in srgb, var(--sky) 18%, var(--bg)) 65%, var(--bg) 100%);
    transition: --sky .8s ease;
  }
  @media (prefers-reduced-motion: reduce) { .sky { transition: none; } }
  .sky .top { display: flex; align-items: flex-start; gap: 8px; }
  .date-hero { flex: 1; }
  .date-hero .d { font: 600 clamp(36px, 9vw, 52px)/1.05 var(--serif); letter-spacing: -0.02em; }
  .date-hero .w { font: 400 20px/1.3 var(--serif); color: var(--muted); margin-top: 4px; }
  .streak { margin-top: 14px; font-size: 15px; color: var(--muted); }
  .streak b { color: var(--ink); font-weight: 600; }
  .ask { font: 500 19px var(--serif); margin: 22px 0 12px; }
  .today-entry { margin-top: 18px; }
  .preview {
    display: block; width: 100%; text-align: left; border: 0; padding: 14px 16px; border-radius: var(--radius);
    background: var(--surface); box-shadow: inset 0 0 0 1px var(--line);
  }
  .preview .t { font: 600 18px var(--serif); margin-bottom: 4px; }
  .preview .s { color: var(--muted); font-size: 15px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .section { margin-top: 28px; }
  .section > h2 { font-size: 22px; margin-bottom: 4px; }
  .section > .sub { color: var(--muted); font-size: 15px; margin: 0 0 12px; }
  .strip { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; }
  .strip button { border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); min-height: 44px; }
  .strip .c { width: 100%; max-width: 30px; aspect-ratio: 1; border-radius: 50%; background: var(--surface-2); }
  .strip .c.has { box-shadow: inset 0 0 0 2px var(--muted); background: var(--surface); }
  .strip .today-mark { color: var(--ink); font-weight: 700; }

  /* Воспоминания — «снимки» */
  .memories { display: grid; gap: 14px; }
  .memory {
    display: grid; grid-template-columns: 1fr; text-align: left; border: 0; padding: 0; overflow: hidden;
    background: var(--surface); border-radius: 6px; box-shadow: 0 1px 0 var(--line), 0 10px 24px -14px rgb(20 24 60 / .35);
  }
  .memory .ph { aspect-ratio: 16 / 10; width: 100%; object-fit: cover; display: block; background: var(--surface-2); }
  .memory .body { padding: 14px 16px 16px; }
  .memory .when { font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .memory .thesis { font: 400 19px/1.45 var(--serif); margin-top: 6px; }
  .memory { align-content: start; }
  .empty-note { padding: 18px; border-radius: var(--radius); border: 1px dashed var(--line); color: var(--muted); font-size: 15px; }

  /* ---------- Записи ---------- */
  .searchbar { display: flex; gap: 8px; align-items: center; }
  .searchbar .field { padding-left: 40px; background: var(--surface) no-repeat 12px 50% / 18px; }
  .search-wrap { position: relative; flex: 1; }
  .search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
  .badge { min-width: 20px; height: 20px; border-radius: 10px; background: var(--ink); color: var(--on-ink); font-size: 12px; display: inline-flex; align-items: center; justify-content: center; padding: 0 6px; }
  .month-h { font: 600 20px var(--serif); margin: 26px 0 8px; display: flex; align-items: baseline; gap: 10px; }
  .month-h .muted { font: 400 14px var(--sans); }
  .list { display: grid; gap: 1px; background: var(--line); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); }
  .item {
    display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: start; text-align: left; border: 0; width: 100%;
    padding: 14px 14px 14px 0; background: var(--surface); position: relative;
  }
  .item::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--mc, transparent); }
  .item .day { text-align: center; padding-left: 8px; }
  .item .day .n { font: 600 26px/1 var(--serif); }
  .item .day .w { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .item .top { display: flex; align-items: flex-start; gap: 8px; min-height: 24px; }
  .item .top .e { font-size: 20px; line-height: 1.2; }
  .item .top .t { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
  .item .flags { padding-top: 3px; }
  .item .flags { display: flex; gap: 4px; color: var(--muted); }
  .item .flags svg { width: 16px; height: 16px; }
  .item .s { color: var(--muted); font-size: 15px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .thumbs { display: flex; gap: 6px; margin-top: 8px; }
  .thumbs img, .thumbs .ph { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; background: var(--surface-2); }
  .more-wrap { text-align: center; margin: 18px 0; }
  .empty { padding: 48px 20px; text-align: center; color: var(--muted); }
  .empty h2 { color: var(--ink); font-size: 22px; margin-bottom: 8px; }

  /* ---------- Календарь ---------- */
  .yearbar { display: flex; align-items: center; gap: 6px; }
  .yearbar .y { font: 600 22px var(--serif); min-width: 70px; text-align: center; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: var(--muted); margin: 10px 0 4px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .months { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px 16px; margin-top: 16px; }
  .mon h3 { font: 600 16px var(--serif); margin-bottom: 6px; }
  .mgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .mgrid .wd { font-size: 10px; color: var(--muted); text-align: center; }
  .cell {
    aspect-ratio: 1; border: 0; padding: 0; border-radius: 5px; background: var(--surface-2); font-size: 10px; color: var(--muted);
    display: flex; align-items: center; justify-content: center; min-width: 0;
  }
  .cell.mood { color: #1c2033; background: var(--mc); }
  .cell.mood.dark { color: #fff; }
  .cell.noted { box-shadow: inset 0 0 0 1.5px var(--muted); background: var(--surface); }
  .cell.today { outline: 2px solid var(--ink); outline-offset: 1px; }
  .cell.future { opacity: .35; }
  .cal-sum { margin-top: 18px; color: var(--muted); font-size: 15px; }

  /* ---------- Аналитика ---------- */
  .yearchips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: none; }
  .yearchips::-webkit-scrollbar { display: none; }
  .yearchips .chip { flex: none; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; margin-top: 14px; }
  .kpi { background: var(--surface); padding: 14px 16px; }
  .kpi .v { font: 600 30px/1.1 var(--serif); display: flex; align-items: baseline; gap: 6px; }
  .kpi .v small { font: 400 15px var(--sans); color: var(--muted); }
  .kpi .k { font-size: 14px; color: var(--muted); margin-top: 4px; }
  .charts { display: grid; grid-template-columns: 1fr; gap: 8px 32px; }
  @media (min-width: 1100px) { .charts { grid-template-columns: 1fr 1fr; } .charts .full { grid-column: 1 / -1; } }
  .chart { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line); min-width: 0; }
  .chart h2 { font-size: 20px; }
  .chart .sub { color: var(--muted); font-size: 14px; margin: 2px 0 10px; }
  .chart .plot { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; font-family: var(--sans); }
  .chart svg text { fill: var(--muted); font-size: 12px; }
  .chart svg .lbl { fill: var(--ink); }
  .chart svg .grid { stroke: var(--line); stroke-width: 1; }
  .chart svg .axis { stroke: var(--muted); stroke-width: 1; }
  .ckey { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; color: var(--muted); margin-top: 8px; }
  .ckey span { display: inline-flex; align-items: center; gap: 6px; }
  .ckey i { width: 18px; height: 3px; border-radius: 2px; display: inline-block; }
  .tip {
    position: absolute; pointer-events: none; z-index: 2; background: var(--ink); color: var(--on-ink); font-size: 13px;
    padding: 8px 10px; border-radius: 10px; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); line-height: 1.4;
  }
  .rank { display: grid; gap: 2px; }
  .rank button, .rank .r { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; text-align: left; border: 0; background: none; padding: 8px 0; border-bottom: 1px solid var(--line); width: 100%; }
  .rank .e { font-size: 22px; }
  .rank .d { font-size: 13px; color: var(--muted); }
  .rank .tx { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .twocol { display: grid; grid-template-columns: 1fr; gap: 8px 28px; }
  @media (min-width: 700px) { .twocol { grid-template-columns: 1fr 1fr; } }
  .h3 { font: 600 17px var(--serif); margin: 14px 0 6px; }
  .tops { display: flex; flex-wrap: wrap; gap: 8px; }

  /* ---------- Лист записи ---------- */
  .sheet { position: fixed; inset: 0; z-index: 40; display: flex; justify-content: center; background: rgb(10 12 30 / .35); }
  .sheet-panel {
    width: 100%; height: 100%; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch;
    animation: up .28s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes up { from { transform: translateY(24px); opacity: .4; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .sheet-panel { animation: none; } }
  @media (min-width: 820px) {

  return new Promise((resolve) => {
    const d = $('#ask');
    let result = false;
    d.replaceChildren(h('p', { class: 'ask-text', text: message }),
      h('div', { class: 'dlg-actions' },
        h('button', { class: 'btn', type: 'button', text: 'Отмена', onclick: () => d.close() }),
        h('button', { class: 'btn ' + (danger ? 'danger-fill' : 'primary'), type: 'button', text: okLabel, onclick: () => { result = true; d.close(); } })));
    d.onclose = () => { d.onclose = null; resolve(result); };
    d.showModal();
  });
}

/* ================= IndexedDB ================= */
let db = null;
function openDB(name) {
  return new Promise((resolve, reject) => {
    const r = indexedDB.open(name, DB_VERSION);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('entries')) d.createObjectStore('entries', { keyPath: 'id' }).createIndex('date', 'date');
      for (const s of ['media', 'thumbs', 'tombstones']) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' });
      if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'key' });
      // Новые хранилища и индексы будущих версий добавляй здесь, проверяя e.oldVersion.
    };
    r.onsuccess = () => { const d = r.result; d.onversionchange = () => d.close(); resolve(d); };
    r.onerror = () => reject(r.error);
    r.onblocked = () => reject(new Error('blocked'));
  });
}
function idbTx(stores, mode, fn) {
  return new Promise((resolve, reject) => {
    const t = db.transaction(stores, mode);
    let out;
    const r = fn(t);
    if (r && typeof r === 'object' && 'onsuccess' in r) r.onsuccess = () => { out = r.result; };
    t.oncomplete = () => resolve(out);
    t.onerror = () => reject(t.error);
    t.onabort = () => reject(t.error || new Error('abort'));
  });
}
const idb = {
  get: (s, k) => idbTx(s, 'readonly', (t) => t.objectStore(s).get(k)),
  all: (s) => idbTx(s, 'readonly', (t) => t.objectStore(s).getAll()),
  keys: (s) => idbTx(s, 'readonly', (t) => t.objectStore(s).getAllKeys()),
  put: (s, v) => idbTx(s, 'readwrite', (t) => t.objectStore(s).put(v)),
  del: (s, k) => idbTx(s, 'readwrite', (t) => t.objectStore(s).delete(k)),
  putMany: (s, arr) => idbTx(s, 'readwrite', (t) => { const os = t.objectStore(s); for (const v of arr) os.put(v); })
};
function storageError(err) {
  toast(err && err.name === 'QuotaExceededError'
    ? 'Не хватает места на устройстве — освободите память и сохраните копию'
    : 'Не удалось сохранить — сделайте резервную копию');
}

/* ================= Состояние ================= */
let settings = clone(DEFAULT_SETTINGS);
let meta = clone(DEFAULT_META);
const entries = new Map();     // id → запись
const byDate = new Map();      // YYYY-MM-DD → запись
const tombs = new Map();       // id → { id, kind, deletedAt }
let sorted = [];               // записи, новые сверху
let tagCounts = new Map(), peopleCounts = new Map();

function blankEntry(date) {
  const now = Date.now();
  return { id: uid(), date, title: '', text: '', mood: null, emotions: [], tags: [], people: [], factors: [],
    sleep: null, media: [], favorite: false, milestone: false, createdAt: now, updatedAt: now };
}
function normEntry(raw) {
  const e = Object.assign(blankEntry(raw.date), raw);
  for (const k of ['emotions', 'tags', 'people', 'factors', 'media']) if (!Array.isArray(e[k])) e[k] = [];
  e.media = e.media.filter((m) => m && m.id).map((m) => ({ id: m.id, kind: m.kind, duration: m.duration || 0 }));
  if (e.mood != null) e.mood = Math.min(7, Math.max(1, Math.round(e.mood)));
  e.title = e.title || ''; e.text = e.text || '';
  return e;
}
const isEmpty = (e) => !e || (!e.text.trim() && !e.title.trim() && e.mood == null && !e.media.length &&
  !e.emotions.length && !e.tags.length && !e.people.length && !e.factors.length && e.sleep == null);
const hasDay = (d) => { const e = byDate.get(d); return !!e && !isEmpty(e); };

function countInto(map, values) {
  for (const v of values) {
    const k = norm(v);
    const r = map.get(k);
    if (r) r.n++; else map.set(k, { label: v, n: 1 });
  }
}
function rebuildIndex() {
  sorted = [...entries.values()].sort((a, b) => b.date.localeCompare(a.date));
  const t = new Map(), p = new Map();
  for (const e of sorted) { countInto(t, e.tags); countInto(p, e.people); }
  tagCounts = new Map([...t.values()].map((r) => [r.label, r.n]));
  peopleCounts = new Map([...p.values()].map((r) => [r.label, r.n]));
}

async function loadAll() {
  db = await openDB(DB_NAME);
  const [es, ms, ts] = await Promise.all([idb.all('entries'), idb.all('meta'), idb.all('tombstones')]);
  const metaMap = Object.fromEntries(ms.map((r) => [r.key, r.value]));
  settings = Object.assign(clone(DEFAULT_SETTINGS), metaMap.settings || {});
  meta = Object.assign(clone(DEFAULT_META), metaMap.state || {});
  entries.clear(); byDate.clear(); tombs.clear();
  for (const raw of es) { const e = normEntry(raw); entries.set(e.id, e); byDate.set(e.date, e); }
  for (const t of ts) tombs.set(t.id, t);
  await migrateData(metaMap.schemaVersion || SCHEMA_VERSION);
  rebuildIndex();
}

// Приводит данные старых версий к текущей схеме. Старые записи не теряются.
async function migrateData(from) {
  let v = from;
  // Пример будущего шага:
  // if (v < 2) { for (const e of entries.values()) e.newField = e.newField ?? null; await idb.putMany('entries', [...entries.values()]); v = 2; }
  v = SCHEMA_VERSION;
  if (v !== from || !(await idb.get('meta', 'schemaVersion'))) await idb.put('meta', { key: 'schemaVersion', value: v });
}
const saveSettings = () => idb.put('meta', { key: 'settings', value: settings }).catch(storageError);
const saveMeta = () => idb.put('meta', { key: 'state', value: meta }).catch(storageError);

function syncHashtags(e) {
  const re = /#([\p{L}\p{N}_-]{2,40})/gu;
  for (const src of [e.text, e.title]) for (const m of String(src).matchAll(re)) addUnique(e.tags, m[1]);
}
async function saveEntry(e, touch = true) {
  if (touch) e.updatedAt = Date.now();
  syncHashtags(e);
  const known = entries.has(e.id);
  if (!known && isEmpty(e)) return false;
  for (const [d, x] of byDate) if (x === e && d !== e.date) byDate.delete(d);
  entries.set(e.id, e); byDate.set(e.date, e);
  try { await idb.put('entries', e); } catch (err) { storageError(err); return false; }
  rebuildIndex();
  return true;
}
async function putTomb(id, kind) {
  const t = { id, kind, deletedAt: Date.now() };
  tombs.set(id, t);
  await idb.put('tombstones', t).catch(() => {});
}
async function deleteMediaRecords(ids) {
  if (!ids.length) return;
  await idbTx(['media', 'thumbs'], 'readwrite', (t) => {
    for (const id of ids) { t.objectStore('media').delete(id); t.objectStore('thumbs').delete(id); }
  });
  for (const id of ids) revokeMedia(id);
}
async function deleteEntry(e, { withMedia = true, tomb = true } = {}) {
  entries.delete(e.id);
  if (byDate.get(e.date) === e) byDate.delete(e.date);
  await idb.del('entries', e.id).catch(() => {});
  if (withMedia) {
    const ids = e.media.map((m) => m.id);
    await deleteMediaRecords(ids);
    if (tomb) for (const id of ids) await putTomb(id, 'media');
  }
  if (tomb) await putTomb(e.id, 'entry');
  rebuildIndex();
}
// Объединяет запись b в запись a (одна дата, два устройства или смена даты).
function mergeInto(a, b) {
  const newer = (b.updatedAt || 0) > (a.updatedAt || 0) ? b : a, older = newer === a ? b : a;
  const ta = a.text.trim(), tb = b.text.trim();
  if (!ta) a.text = b.text;
  else if (tb && !norm(ta).includes(norm(tb))) {
    if (norm(tb).includes(norm(ta))) a.text = b.text;
    else { const [x, y] = (a.createdAt || 0) <= (b.createdAt || 0) ? [ta, tb] : [tb, ta]; a.text = x + '\n\n— — —\n\n' + y; }
  }
  a.title = newer.title || older.title;
  a.mood = newer.mood ?? older.mood;
  a.sleep = newer.sleep ?? older.sleep;
  for (const k of ['emotions', 'tags', 'people']) for (const v of b[k]) addUnique(a[k], v);
  for (const f of b.factors) if (!a.factors.includes(f)) a.factors.push(f);
  a.media = unionMedia(a.media, b.media);
  a.favorite = a.favorite || b.favorite;
  a.milestone = a.milestone || b.milestone;
  a.createdAt = Math.min(a.createdAt || Date.now(), b.createdAt || Date.now());
  a.updatedAt = Math.max(a.updatedAt || 0, b.updatedAt || 0);
  return a;
}
function unionMedia(a, b) {
  const out = [...a];
  for (const m of b) if (!out.some((x) => x.id === m.id)) out.push(m);
  return out;
}

/* ================= Медиа ================= */
const urlCache = new Map();
async function blobURL(store, id) {
  const key = store + ':' + id;
  if (urlCache.has(key)) return urlCache.get(key);
  let rec = null;
  try { rec = await idb.get(store, id); } catch (e) {}
  if (!rec || !rec.blob) return null;
  const u = URL.createObjectURL(rec.blob);
  urlCache.set(key, u);
  return u;
}
const thumbURL = (id) => blobURL('thumbs', id);
const mediaURL = (id) => blobURL('media', id);
function revokeMedia(id, onlyFull = false) {
  for (const key of onlyFull ? ['media:' + id] : ['media:' + id, 'thumbs:' + id]) {
    if (urlCache.has(key)) { URL.revokeObjectURL(urlCache.get(key)); urlCache.delete(key); }
  }
}
function hydrateThumbs(root) {
  for (const img of root.querySelectorAll('img[data-thumb]')) {
    const id = img.getAttribute('data-thumb');
    img.removeAttribute('data-thumb');
    thumbURL(id).then((u) => { if (u) img.src = u; else img.classList.add('missing'); });
  }
}
const canvasBlob = (c, q = 0.85) => new Promise((res) => c.toBlob((b) => res(b), 'image/jpeg', q));
function drawScaled(src, w0, h0, max, q) {
  const s = Math.min(1, max / Math.max(w0, h0));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w0 * s)); c.height = Math.max(1, Math.round(h0 * s));
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
  g.drawImage(src, 0, 0, c.width, c.height);
  return canvasBlob(c, q).then((blob) => ({ blob, width: c.width, height: c.height }));
}
async function processPhoto(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    img.src = url;
    await img.decode();
    const w = img.naturalWidth, hh = img.naturalHeight;
    const full = await drawScaled(img, w, hh, 2048, 0.85);
    const th = await drawScaled(img, w, hh, 480, 0.8);
    return { blob: full.blob, mime: 'image/jpeg', width: full.width, height: full.height, thumb: th.blob };
  } finally { URL.revokeObjectURL(url); }
}
function processVideo(file) {
  return new Promise((resolve) => {
    const v = document.createElement('video');
    v.muted = true; v.playsInline = true; v.preload = 'auto';
    v.setAttribute('playsinline', ''); v.setAttribute('muted', '');
    const url = URL.createObjectURL(file);
    let done = false;
    const finish = (thumb) => {
      if (done) return; done = true;
      clearTimeout(timer);
      const r = { blob: file, mime: file.type || 'video/mp4', width: v.videoWidth || 0, height: v.videoHeight || 0, duration: isFinite(v.duration) ? v.duration : 0, thumb };
      v.removeAttribute('src'); v.load(); URL.revokeObjectURL(url);
      resolve(r);
    };
    const timer = setTimeout(() => finish(null), 8000);
    v.onloadeddata = () => { try { v.currentTime = Math.min(0.5, (v.duration || 1) / 2); } catch (e) { finish(null); } };
    v.onseeked = async () => {
      try { const t = await drawScaled(v, v.videoWidth, v.videoHeight, 480, 0.8); finish(t.blob); } catch (e) { finish(null); }
    };
    v.onerror = () => finish(null);
    v.src = url;
    v.load();
  });
}
async function storeMedia(entry, rec) {
  const id = uid();
  const record = { id, entryId: entry.id, kind: rec.kind, mime: rec.mime, blob: rec.blob, width: rec.width || 0,
    height: rec.height || 0, duration: rec.duration || 0, size: rec.blob.size, createdAt: Date.now() };
  await idbTx(['media', 'thumbs'], 'readwrite', (t) => {
    t.objectStore('media').put(record);
    if (rec.thumb) t.objectStore('thumbs').put({ id, blob: rec.thumb });
  });
  entry.media.push({ id, kind: rec.kind, duration: rec.duration || 0 });
  await saveEntry(entry);
  return id;
}
async function addFiles(entry, files, onEach) {
  let added = 0;
  for (const file of files) {
    const isVideo = (file.type || '').startsWith('video') || /\.(mov|mp4|m4v|webm)$/i.test(file.name);
    try {
      if (isVideo) {
        if (file.size > 200e6 && !(await ask('Видео «' + file.name + '» занимает ' + fmtMB(file.size) + '. Такие ролики быстро заполняют память. Всё равно добавить?', 'Добавить'))) continue;
        const r = await processVideo(file);
        await storeMedia(entry, { kind: 'video', ...r });
      } else {
        const r = await processPhoto(file);
        await storeMedia(entry, { kind: 'photo', ...r });
      }
      added++;
      onEach && onEach();
    } catch (err) {
      if (err && err.name === 'QuotaExceededError') { storageError(err); break; }
      toast('Не удалось добавить «' + (file.name || 'файл') + '»');
    }
  }
  return added;
}
async function removeMedia(entry, id) {
  entry.media = entry.media.filter((m) => m.id !== id);
  await deleteMediaRecords([id]);
  await putTomb(id, 'media');
  await saveEntry(entry);
}

// Голосовые заметки
async function startRecording(onStop) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
    toast('Запись голоса на этом устройстве недоступна'); return null;
  }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { toast('Нет доступа к микрофону — разрешите его в настройках Safari'); return null; }
  const types = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'];
  const type = types.find((t) => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
  const rec = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
  const chunks = [];
  const started = Date.now();
  rec.ondataavailable = (ev) => { if (ev.data && ev.data.size) chunks.push(ev.data); };
  rec.onstop = () => {
    stream.getTracks().forEach((t) => t.stop());
    clearTimeout(limit);
    const mime = (rec.mimeType || type || 'audio/mp4').split(';')[0];
    onStop(new Blob(chunks, { type: mime }), (Date.now() - started) / 1000);
  };
  rec.start(1000);
  const limit = setTimeout(() => { if (rec.state !== 'inactive') rec.stop(); }, 15 * 60 * 1000);
  return { started, stop: () => { if (rec.state !== 'inactive') rec.stop(); } };
}

/* ================= ZIP (без сжатия, свой код) ================= */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();

  let crc = 0xFFFFFFFF;
  const CH = 4 << 20;
  for (let o = 0; o < blob.size; o += CH) {
    const buf = new Uint8Array(await blob.slice(o, o + CH).arrayBuffer());
    for (let i = 0; i < buf.length; i++) crc = CRC_TABLE[(crc ^ buf[i]) & 0xff] ^ (crc >>> 8);
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
async function buildZip(files, onProgress) {

  const dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();

    const name = enc.encode(f.name);
    const crc = await crcBlob(f.blob);
    const size = f.blob.size;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, size, true); lh.setUint32(22, size, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(lh.buffer, name, f.blob);

    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(10, 0, true); ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, size, true); ch.setUint32(24, size, true); ch.setUint16(28, name.length, true);
    ch.setUint32(42, offset, true);
    central.push(ch.buffer, name);
    offset += 30 + name.length + size;
    if (offset > 0xFFFFFFFF) throw new Error('too-big');
    onProgress && onProgress(++i / files.length);

  eocd.setUint32(0, 0x06054b50, true); eocd.setUint16(8, files.length, true); eocd.setUint16(10, files.length, true);

async function readZip(file) {

  for (let i = tailLen - 22; i >= 0; i--) if (tail.getUint32(i, true) === 0x06054b50) { p = i; break; }
  if (p < 0) throw new Error('not-zip');
  const count = tail.getUint16(p + 10, true), cdSize = tail.getUint32(p + 12, true), cdOff = tail.getUint32(p + 16, true);
  const cd = new DataView(await file.slice(cdOff, cdOff + cdSize).arrayBuffer());

async function exportArchive({ since = 0, withMedia = true }, onProgress) {

  const files = [], mediaOut = [];
  if (withMedia) {
    for (const e of es) for (const d of e.media) {
      const rec = await idb.get('media', d.id).catch(() => null);
      if (!rec || !rec.blob || (since && rec.createdAt < since)) continue;
      const name = 'media/' + rec.id + '.' + extFor(rec.mime, rec.kind);
      files.push({ name, blob: rec.blob });
      const th = await idb.get('thumbs', rec.id).catch(() => null);
      let tname = null;
      if (th && th.blob) { tname = 'thumbs/' + rec.id + '.jpg'; files.push({ name: tname, blob: th.blob }); }
      const { blob, ...m } = rec;
      mediaOut.push({ ...m, entryId: e.id, file: name, thumb: tname });
    }

  const data = {
    app: APP_ID, format: 1, schemaVersion: SCHEMA_VERSION, appVersion: APP_VERSION,
    exportedAt: new Date().toISOString(), since: since ? new Date(since).toISOString() : null, withMedia,
    entries: es, media: mediaOut, tombstones: [...tombs.values()].filter((t) => t.deletedAt >= since),
    settings: { emotions: settings.emotions, factors: settings.factors, dayStart: settings.dayStart }

async function mergeImport(data, zip, onProgress) {
  await flushSaves();
  const rep = { added: 0, updated: 0, merged: 0, media: 0, removed: 0 };
  const s = data.settings || {};
  let settingsChanged = false;
  for (const em of s.emotions || []) settingsChanged = addUnique(settings.emotions, em) || settingsChanged;
  for (const f of s.factors || []) if (f && f.id && !settings.factors.some((x) => x.id === f.id)) { settings.factors.push({ id: f.id, name: f.name }); settingsChanged = true; }
  if (settingsChanged) await saveSettings();

  // 1. Удаления
  for (const t of data.tombstones || []) {
    if (!t || !t.id) continue;
    const lt = tombs.get(t.id);
    if (!lt || lt.deletedAt < t.deletedAt) { tombs.set(t.id, t); await idb.put('tombstones', t).catch(() => {}); }
    if (t.kind === 'entry') {
      const e = entries.get(t.id);
      if (e && e.updatedAt <= t.deletedAt) { await deleteEntry(e, { tomb: false }); rep.removed++; }
    } else if (t.kind === 'media') {
      await deleteMediaRecords([t.id]);
    }
  }
  // 2. Записи
  const alias = new Map();
  const touched = new Set();
  for (const raw of data.entries) {
    if (!raw || !raw.id || !/^\d{4}-\d{2}-\d{2}$/.test(raw.date || '')) continue;
    const inc = normEntry(clone(raw));
    const t = tombs.get(inc.id);
    if (t && t.deletedAt >= inc.updatedAt) continue;
    const local = entries.get(inc.id);
    if (local) {
      if (inc.updatedAt > local.updatedAt) {
        const media = unionMedia(local.media, inc.media);
        if (byDate.get(local.date) === local) byDate.delete(local.date);
        Object.assign(local, inc, { media });
        byDate.set(local.date, local);
        rep.updated++;
      } else local.media = unionMedia(local.media, inc.media);
      touched.add(local);
    } else {
      const other = byDate.get(inc.date);
      if (other) {
        const before = JSON.stringify(other);
        mergeInto(other, inc);
        alias.set(inc.id, other.id);
        if (JSON.stringify(other) !== before) { touched.add(other); rep.merged++; }
      }
      else { entries.set(inc.id, inc); byDate.set(inc.date, inc); touched.add(inc); rep.added++; }
    }
  }
  // 3. Медиа
  const have = new Set(await idb.keys('media'));
  const list = data.media || [];
  let i = 0;
  for (const m of list) {
    i++; onProgress && onProgress(i / Math.max(1, list.length));
    if (!m || !m.id || have.has(m.id) || tombs.has(m.id) || !zip) continue;
    const blob = await zipBlob(zip, m.file, m.mime || '').catch(() => null);
    if (!blob) continue;
    let thumb = m.thumb ? await zipBlob(zip, m.thumb, 'image/jpeg').catch(() => null) : null;
    if (!thumb && m.kind === 'photo') thumb = (await processPhoto(blob).catch(() => ({}))).thumb || null;
    const { file, thumb: _t, ...rest } = m;
    const record = { ...rest, entryId: alias.get(m.entryId) || m.entryId, blob, size: blob.size };
    try {
      await idbTx(['media', 'thumbs'], 'readwrite', (tx) => {
        tx.objectStore('media').put(record);
        if (thumb) tx.objectStore('thumbs').put({ id: m.id, blob: thumb });
      });
    } catch (err) { storageError(err); break; }
    have.add(m.id); rep.media++;
  }
  // 4. Ссылки только на существующие медиа
  for (const e of entries.values()) {
    const before = e.media.length;
    e.media = e.media.filter((d) => have.has(d.id));
    if (e.media.length !== before) touched.add(e);
  }
  try { await idb.putMany('entries', [...touched].filter((e) => entries.has(e.id))); } catch (err) { storageError(err); }
  rebuildIndex();
  return rep;
}

  const saved = h('div', { class: 'saved', text: entries.has(e.id) ? 'Изменения сохраняются автоматически' : 'Запись появится, как только вы что-нибудь добавите' });
  const changed = () => scheduleSave(e, saved);

  const dateD = h('div', { class: 'd', text: fmtDate(e.date) });
  const dateW = h('div', { class: 'w', text: cap(weekday(e.date)) + ' — изменить дату' });
  const dateInput = h('input', { type: 'date', max: todayStr(), 'aria-label': 'Дата записи', onchange: async (ev) => {
    const res = await changeDate(e, ev.target.value);
    if (res && res !== e) { renderEditorInto(res, s); return; }
    ev.target.value = e.date; dateD.textContent = fmtDate(e.date); dateW.textContent = cap(weekday(e.date)) + ' — изменить дату';
  } });
  dateInput.value = e.date;

  const capEl = h('div', { class: 'mood-caption', text: e.mood ? MOODS[e.mood].t : 'Как прошёл день?' });
  const row = moodRow(e.mood, (m) => {
    e.mood = e.mood === m ? null : m;
    row.setValue(e.mood);
    capEl.textContent = e.mood ? MOODS[e.mood].t : 'Как прошёл день?';
    changed();
  });

  const emoList = [...settings.emotions];
  for (const x of e.emotions) if (!emoList.some((y) => norm(y) === norm(x))) emoList.push(x);
  const emo = h('div', { class: 'chips' }, emoList.map((x) => {
    const b = h('button', { class: 'chip', type: 'button', text: x, 'aria-pressed': String(e.emotions.some((y) => norm(y) === norm(x))) });
    b.onclick = () => {
      const i = e.emotions.findIndex((y) => norm(y) === norm(x));
      if (i >= 0) e.emotions.splice(i, 1); else e.emotions.push(x);
      b.setAttribute('aria-pressed', String(i < 0)); changed();
    };
    return b;
  }));

  const title = h('input', { class: 'e-title', type: 'text', maxlength: '120', placeholder: 'Главное за день — одной строкой',
    enterkeyhint: 'next', 'aria-label': 'Главное за день', oninput: (ev) => { e.title = ev.target.value; changed(); } });
  title.value = e.title;
  const text = h('textarea', { class: 'e-text', 'aria-label': 'Текст записи',
    placeholder: 'Что сегодня происходило? Теги можно ставить прямо в тексте: #отпуск' });
  text.value = e.text;
  const grow = () => { text.style.height = 'auto'; text.style.height = Math.max(220, text.scrollHeight + 2) + 'px'; };
  text.addEventListener('input', () => { e.text = text.value; grow(); changed(); });

  const media = h('div');
  const refreshMedia = () => { media.replaceChildren(mediaBlock(e, true, refreshMedia) || ''); hydrateThumbs(media); };
  const doAdd = async (files) => {
    if (!files.length) return;
    toast(files.length === 1 ? 'Добавляю файл…' : 'Добавляю ' + files.length + ' ' + plural(files.length, ['файл', 'файла', 'файлов']) + '…');
    saved.textContent = 'Сохраняю фото и видео…';
    await flushSaves();
    const n = await addFiles(e, files, refreshMedia);
    refreshMedia();
    saved.textContent = 'Сохранено';
    if (n) toast(n === 1 ? 'Добавлено' : 'Добавлено файлов: ' + n);
  };
  const fileInput = h('input', { type: 'file', accept: 'image/*,video/*', multiple: true, hidden: true,
    onchange: (ev) => { const files = [...ev.target.files]; ev.target.value = ''; doAdd(files); } });
  const recBox = h('div');
  const micBtn = h('button', { class: 'btn', type: 'button' }, icon('mic'), 'Голос');
  micBtn.onclick = async () => {
    if (rec) return;
    const r = await startRecording(async (blob, dur) => {
      rec = null; recBox.replaceChildren(); micBtn.disabled = false;
      if (blob.size < 500) return;
      await flushSaves();
      await storeMedia(e, { kind: 'audio', blob, mime: blob.type, duration: dur });
      refreshMedia(); toast('Голосовая заметка сохранена');
    });
    if (!r) return;
    rec = r; micBtn.disabled = true;
    const timeEl = h('span', { class: 'grow', text: '0:00' });
    const tick = setInterval(() => { if (!rec) { clearInterval(tick); return; } timeEl.textContent = fmtDur((Date.now() - r.started) / 1000); }, 500);
    recBox.replaceChildren(h('div', { class: 'rec', style: 'margin-top:10px' }, h('span', { class: 'live' }), h('span', { text: 'Идёт запись' }), timeEl,
      h('button', { class: 'btn primary', type: 'button', text: 'Стоп', onclick: () => r.stop() })));
  };

  const factors = h('div', { class: 'chips' }, settings.factors.map((f) => {
    const b = h('button', { class: 'chip', type: 'button', text: f.name, 'aria-pressed': String(e.factors.includes(f.id)) });
    b.onclick = () => {
      const i = e.factors.indexOf(f.id);
      if (i >= 0) e.factors.splice(i, 1); else e.factors.push(f.id);
      b.setAttribute('aria-pressed', String(i < 0)); changed();
    };
    return b;
  }));
  const sv = h('button', { class: 'v', type: 'button', 'aria-label': 'Сон, часов. Коснитесь, чтобы очистить' });
  const paintSleep = () => { sv.textContent = e.sleep == null ? '—' : fmtSleep(e.sleep); };
  const step = (d) => { e.sleep = e.sleep == null ? 7 : Math.min(14, Math.max(0, e.sleep + d)); paintSleep(); changed(); };
  sv.onclick = () => { e.sleep = e.sleep == null ? 7 : null; paintSleep(); changed(); };
  paintSleep();

  const bar = h('div', { class: 'sheet-bar' },
    h('button', { class: 'btn primary', type: 'button', text: 'Готово', onclick: closeSheet }),
    h('div', { class: 'title', text: 'Запись' }), starBtn(e), flagBtn(e));
  const body = h('div', { class: 'sheet-body' },
    h('label', { class: 'e-date' }, dateD, dateW, dateInput),
    block('Настроение', row, capEl),
    block('Эмоции', emo),
    block(null, title),
    block(null, text),
    block('Фото, видео и голос', h('div', { class: 'row' },
      h('button', { class: 'btn', type: 'button', onclick: () => fileInput.click() }, icon('image'), 'Фото или видео'), micBtn, fileInput), recBox, media),
    block('Теги', tagEditor(e.tags, tagCounts, '#', 'Например: работа, отпуск', changed)),
    block('С кем', tagEditor(e.people, peopleCounts, '', 'Имя', changed)),
    block('Факторы дня', factors),
    block('Сон', h('div', { class: 'row' }, h('div', { class: 'stepper' },
      h('button', { class: 'btn icon ghost', type: 'button', 'aria-label': 'Меньше сна', text: '−', onclick: () => step(-0.5) }), sv,
      h('button', { class: 'btn icon ghost', type: 'button', 'aria-label': 'Больше сна', text: '+', onclick: () => step(0.5) })))),
    saved,
    entries.has(e.id) ? h('div', { class: 'e-block', style: 'text-align:center' },
      h('button', { class: 'btn ghost danger', type: 'button', onclick: () => confirmDelete(e) }, icon('trash'), 'Удалить запись')) : null);
  s.panel.replaceChildren(bar, body);
  s.panel.scrollTop = 0;
  s.onClose = async () => {
    if (rec) { rec.stop(); await new Promise((r) => setTimeout(r, 400)); }
    await flushSaves();
    if (entries.has(e.id) && isEmpty(e)) await deleteEntry(e);
    return true;
  };
  refreshMedia();
  requestAnimationFrame(grow);
  return { addFiles: doAdd };
}

let vItems = [], vIdx = 0;
async function openViewer(items, idx) {
  vItems = items; vIdx = idx;
  const dlg = $('#viewer');
  if (!dlg.open) dlg.showModal();
  await showViewerItem();
}
async function showViewerItem() {
  const wrap = $('#vwrap');
  for (const v of wrap.querySelectorAll('video')) v.pause();
  wrap.replaceChildren();
  const it = vItems[vIdx];
  $('#vcount').textContent = (vIdx + 1) + ' из ' + vItems.length;
  $('#vprev').disabled = vIdx === 0; $('#vnext').disabled = vIdx === vItems.length - 1;
  $('#vprev').hidden = $('#vnext').hidden = vItems.length < 2;
  const u = await mediaURL(it.id);
  if (vItems[vIdx] !== it) return;
  if (!u) { wrap.append(h('p', { text: 'Файл не найден на этом устройстве' })); return; }
  wrap.append(it.kind === 'video' ? h('video', { src: u, controls: true, playsinline: true, autoplay: true }) : h('img', { src: u, alt: '' }));
}
function viewerStep(d) { const n = vIdx + d; if (n >= 0 && n < vItems.length) { vIdx = n; showViewerItem(); } }
function viewerCleanup() {
  const wrap = $('#vwrap');
  for (const v of wrap.querySelectorAll('video')) v.pause();
  wrap.replaceChildren();
  for (const it of vItems) revokeMedia(it.id, true);
}

function pinPad({ title, sub, onEnter, onCancel, forgot }) {
  let code = '', busy = false;
  const titleEl = h('h2', { text: title });
  const msg = h('div', { class: 'msg', text: sub || '' });
  const dots = h('div', { class: 'pins', 'aria-hidden': 'true' }, [0, 1, 2, 3].map(() => h('i')));
  const paint = () => [...dots.children].forEach((d, i) => d.classList.toggle('on', i < code.length));
  const el = h('div', { class: 'lock', role: 'dialog', 'aria-modal': 'true', 'aria-label': title });
  const api = {
    setTitle: (t) => { titleEl.textContent = t; },
    setMsg: (t) => { msg.textContent = t; },
    close: () => { el.remove(); document.removeEventListener('keydown', onKey); }
  };
  const press = async (k) => {
    if (busy) return;
    if (k === 'del') { code = code.slice(0, -1); paint(); return; }
    if (code.length >= 4) return;
    code += k; paint();
    if (code.length < 4) return;
    busy = true;
    const r = await onEnter(code, api);
    busy = false;
    if (r === true) { api.close(); return; }
    code = '';
    if (r === 'keep') { paint(); return; }
    dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake');
    setTimeout(paint, 250);
  };
  const onKey = (ev) => { if (/^\d$/.test(ev.key)) press(ev.key); else if (ev.key === 'Backspace') press('del'); };
  const extra = onCancel ? h('button', { type: 'button', class: 'txt', text: 'Отмена', onclick: () => { api.close(); onCancel(); } })
    : forgot ? h('button', { type: 'button', class: 'txt', text: 'Забыли?', onclick: forgot }) : h('span', { class: 'blank' });
  const pad = h('div', { class: 'keypad' },
    ['1', '2', '3', '4', '5', '6', '7', '8', '9'].map((k) => h('button', { type: 'button', text: k, onclick: () => press(k) })),
    extra, h('button', { type: 'button', text: '0', onclick: () => press('0') }),
    h('button', { type: 'button', 'aria-label': 'Стереть', text: '⌫', onclick: () => press('del') }));
  document.addEventListener('keydown', onKey);
  el.append(icon('lock'), titleEl, msg, dots, pad);
  document.body.append(el);
  return api;
}
let pinFails = 0, pinBlockedUntil = 0;
function lockApp() {
  if (!settings.pinHash || locked) return;
  locked = true;
  hideVeil();
  pinPad({ title: 'Дневник', sub: 'Введите код-пароль', forgot: forgotPin, onEnter: async (code, api) => {
    if (Date.now() < pinBlockedUntil) { api.setMsg('Подождите ' + Math.ceil((pinBlockedUntil - Date.now()) / 1000) + ' с'); return 'keep'; }
    if ((await hashPin(code, settings.pinSalt)) === settings.pinHash) { pinFails = 0; locked = false; return true; }
    if (++pinFails >= 5) { pinFails = 0; pinBlockedUntil = Date.now() + 30000; api.setMsg('Слишком много попыток. Подождите 30 секунд'); }
    else api.setMsg('Неверный код');
    return false;
  } });
}
async function forgotPin() {
  if (!(await ask('Код-пароль нельзя восстановить. Сбросить его можно только вместе с удалением всех записей на этом устройстве. Продолжить?', 'Продолжить', true))) return;
  if (!(await ask('Точно удалить все записи, фото и видео? Если у вас есть резервная копия, её можно будет загрузить заново.', 'Удалить всё', true))) return;
  await wipeAll();
}
function setupPin(after) {
  let first = null;
  pinPad({ title: 'Новый код-пароль', sub: 'Придумайте 4 цифры', onCancel: () => after && after(), onEnter: async (code, api) => {
    if (first == null) { first = code; api.setTitle('Повторите код'); api.setMsg('Введите те же 4 цифры'); return 'keep'; }
    if (code !== first) { first = null; api.setTitle('Новый код-пароль'); api.setMsg('Коды не совпали. Придумайте код заново'); return false; }
    settings.pinSalt = randomSalt();
    settings.pinHash = await hashPin(code, settings.pinSalt);
    await saveSettings();
    toast('Код-пароль включён');
    after && after();
    return true;
  } });
}
function verifyPin(title, then) {
  pinPad({ title, sub: 'Введите текущий код', onCancel: () => {}, onEnter: async (code, api) => {
    if ((await hashPin(code, settings.pinSalt)) !== settings.pinHash) { api.setMsg('Неверный код'); return false; }
    then();
    return true;
  } });
}

function tipLayer(plot) {

function monthlyAvg(year) {
  const sum = Array(12).fill(0), cnt = Array(12).fill(0);
  for (const e of entries.values()) if (e.mood && e.date.startsWith(year)) { const m = +e.date.slice(5, 7) - 1; sum[m] += e.mood; cnt[m]++; }
  return sum.map((s, i) => cnt[i] ? s / cnt[i] : null);
}
function lineChart(plot, W, series) {
  const H = 240, ml = 30, mr = 44, mt = 16, mb = 26;
  const iw = Math.max(120, W - ml - mr), ih = H - mt - mb;
  const all = series.flatMap((s) => s.values).filter((v) => v != null);

  const svg = S('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img', 'aria-label': 'Среднее настроение по месяцам' });
  for (let v = lo; v <= hi; v++) {

    svg.append(S('text', { x: ml - 6, y: y(v) + 5, 'text-anchor': 'end', style: 'font-size:14px' }, MOODS[v].e));
  }
  const narrow = iw < 420;
  for (let i = 0; i < 12; i++) svg.append(S('text', { x: x(i), y: H - 6, 'text-anchor': 'middle' }, narrow ? MONTHS[i][0] : MONTHS_S[i]));
  const pathD = (vals) => { let d = '', pen = false; vals.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1); pen = true; }); return d; };
  const strong = series.find((s) => s.strong), others = series.filter((s) => !s.strong);
  const labels = [];
  for (const s of others) {
    svg.append(S('path', { d: pathD(s.values), fill: 'none', 'stroke-width': 1.5, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', style: 'stroke: var(--muted); stroke-opacity: .45' }));
    const li = lastIdx(s.values);
    if (li >= 0 && others.length <= 2) labels.push({ x: x(li) + 8, y: y(s.values[li]) + 4, t: s.label });
  }
  if (strong) {
    svg.append(S('path', { d: pathD(strong.values), fill: 'none', 'stroke-width': 2.5, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', style: 'stroke: var(--ink)' }));
    strong.values.forEach((v, i) => { if (v != null) svg.append(S('circle', { cx: x(i), cy: y(v), r: 5, style: `fill: var(--m${Math.round(v)}); stroke: var(--surface); stroke-width: 2` })); });
    const li = lastIdx(strong.values);

  for (const l of labels) svg.append(S('text', { x: l.x, y: l.y, class: l.strong ? 'lbl' : null, style: l.strong ? 'font-weight:600' : null }, l.t));
  const cross = S('line', { y1: mt, y2: mt + ih, class: 'axis', visibility: 'hidden' });
  const hit = S('rect', { x: ml, y: mt, width: iw, height: ih, fill: 'transparent', style: 'touch-action: pan-y' });
  svg.append(cross, hit);
  plot.append(svg);
  const tip = tipLayer(plot);

    const lines = [MONTHS[i]];
    let top = mt + ih;
    for (const s of [strong, ...others].filter(Boolean)) {
      const v = s.values[i];
      if (v != null) { lines.push(s.label + ': ' + fmt1(v) + ' ' + MOODS[Math.round(v)].e); top = Math.min(top, y(v)); }

}

function influence(list, keysOf) {

  for (const e of all) {
    const seen = new Set();
    for (const [k, label] of keysOf(e)) {
      if (seen.has(k)) continue;
      seen.add(k);
      const r = map.get(k) || { label, sum: 0, n: 0 };
      r.sum += e.mood; r.n++; map.set(k, r);

  }
  const out = [];
  for (const r of map.values()) {
    if (r.n < 3 || N - r.n < 3) continue;
    const a = r.sum / r.n, b = (tot - r.sum) / (N - r.n);
    out.push({ label: r.label, delta: a - b, n: r.n, avg: a });
  }
  return out.sort((a, b) => b.delta - a.delta);
}

  // 1. Месяцы и сравнение лет
  const withData = ys.filter((y) => moodCount(y) > 0);
  const strongY = Y === 'all' ? withData[0] : yr;
  const others = withData.filter((y) => y !== strongY).slice(0, Y === 'all' ? 6 : 4);
  const series = [{ label: String(strongY), values: monthlyAvg(String(strongY)), strong: true }, ...others.map((y) => ({ label: String(y), values: monthlyAvg(String(y)) }))];
  add(Y === 'all' ? 'Настроение по месяцам, все годы' : 'Настроение по месяцам',
    others.length ? 'Среднее за месяц. Тонкие линии — другие годы для сравнения. Коснитесь графика, чтобы увидеть значения.' : 'Среднее за месяц. Коснитесь графика, чтобы увидеть значения.',
    (p, w) => lineChart(p, w, series), 'full');

  if (Y === 'all' && withData.length > 1) {
    const yAsc = [...withData].sort();
    add('Настроение по годам', 'Среднее за год; выше линии 😐 — лучше нейтрального', (p, w) => devChart(p, w, {
      title: 'Настроение по годам', labels: yAsc.map(String),
      values: yAsc.map((y) => avgOf(all.filter((e) => e.mood && e.date.startsWith(String(y))).map((e) => e.mood))),
      counts: yAsc.map((y) => moodCount(y)) }));
    add('Записей по годам', null, (p, w) => barChart(p, w, {
      title: 'Записей по годам', labels: yAsc.map(String), colors: ['var(--ink)'],
      values: yAsc.map((y) => all.filter((e) => e.date.startsWith(String(y))).length) }));
  }

  // 2. Распределение оценок
  const dist = [1, 2, 3, 4, 5, 6, 7].map((m) => ml.filter((e) => e.mood === m).length);
  add('Как распределились оценки', 'Сколько дней с каждой оценкой', (p, w) => barChart(p, w, {
    title: 'Распределение оценок', labels: [1, 2, 3, 4, 5, 6, 7].map((m) => MOODS[m].e), emoji: true,
    colors: [1, 2, 3, 4, 5, 6, 7].map((m) => `var(--m${m})`), values: dist, tipOf: (i) => MOODS[i + 1].t + ': ' + nDays(dist[i]) }));

  // 3. Дни недели
  const wd = Array.from({ length: 7 }, () => []);
  for (const e of ml) wd[(parseYmd(e.date).getDay() + 6) % 7].push(e.mood);
  add('Дни недели', 'Среднее настроение; выше линии 😐 — лучше нейтрального', (p, w) => devChart(p, w, {
    title: 'Настроение по дням недели', labels: ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'], values: wd.map(avgOf), counts: wd.map((a) => a.length) }));

  // 4. Влияние
  const effSub = 'На сколько среднее настроение в такие дни выше (+) или ниже (−), чем в остальные. Учитывается, если отмечено хотя бы в 3 днях.';
  const fx = influence(list, (e) => e.factors.map((f) => [f, factorName(f)]));
  addNode('Что влияет на настроение', effSub, fx.length ? divRows(fx) : h('p', { class: 'muted small', text: 'Отмечайте факторы дня в записях — здесь появится их влияние.' }));
  const tg = topByEffect(influence(list, (e) => e.tags.map((x) => [norm(x), '#' + x])));
  if (tg.length) addNode('Теги и настроение', 'Самые заметные связи, плюс и минус', divRows(tg));
  const pp = topByEffect(influence(list, (e) => e.people.map((x) => [norm(x), x])));
  if (pp.length) addNode('Люди и настроение', 'В дни, когда вы отмечали этих людей', divRows(pp));

  // 5. Сон
  const sl = [[], [], [], []];
  for (const e of ml) if (e.sleep != null) sl[e.sleep < 6 ? 0 : e.sleep < 7 ? 1 : e.sleep < 8 ? 2 : 3].push(e.mood);
  if (sl.some((a) => a.length >= 3)) add('Сон и настроение', 'Среднее настроение в зависимости от сна накануне', (p, w) => devChart(p, w, {
    title: 'Сон и настроение', labels: ['< 6 ч', '6–7 ч', '7–8 ч', '8+ ч'], values: sl.map((a) => a.length ? avgOf(a) : null), counts: sl.map((a) => a.length) }));

  // 6. Эмоции
  const em = countTop(list, (e) => e.emotions, 10);
  if (em.length) addNode('Эмоции', 'Сколько дней отмечена каждая эмоция', freqRows(em));

  // 7. Итоги года
  if (Y !== 'all') charts.append(yearSummary(list, Y));

  v.append(charts);
  requestAnimationFrame(() => { statsWidth = v.clientWidth; for (const f of later) f(); });
}
function yearSummary(list, Y) {
  const wm = list.filter((e) => e.mood);
  const weight = (e) => e.text.length + e.title.length * 3 + e.media.length * 200;
  const best = wm.filter((e) => e.mood >= 5).sort((a, b) => b.mood - a.mood || weight(b) - weight(a)).slice(0, 5);
  const hard = wm.filter((e) => e.mood <= 3).sort((a, b) => a.mood - b.mood || weight(b) - weight(a)).slice(0, 5);
  const ms = list.filter((e) => e.milestone).sort((a, b) => a.date.localeCompare(b.date));
  const rank = (arr, empty) => arr.length ? h('div', { class: 'rank' }, arr.map((e) => h('button', { type: 'button', onclick: () => openEntry(e.id) },
    h('span', { class: 'e', text: e.mood ? MOODS[e.mood].e : '•' }),
    h('span', { style: 'min-width:0' }, h('div', { class: 'tx', text: e.title || firstSentence(e.text, 90) || (e.mood ? MOODS[e.mood].t : 'Без текста') }), h('div', { class: 'd', text: fmtDate(e.date, false) })),
    h('span')))) : h('p', { class: 'muted small', text: empty });
  const tops = (label, items, prefix = '') => items.length ? h('div', null, h('div', { class: 'h3', text: label }),
    h('div', { class: 'tops' }, items.map((i) => h('span', { class: 'chip static', text: prefix + i.label + ' ' + i.n })))) : null;
  return h('section', { class: 'chart full' }, h('h2', { text: 'Итоги ' + Y + ' года' }),
    h('p', { class: 'sub', text: 'Коснитесь дня, чтобы открыть запись' }),
    h('div', { class: 'twocol' },
      h('div', null, h('div', { class: 'h3', text: 'Лучшие дни' }), rank(best, 'Дней с оценкой 5–7 пока нет')),
      h('div', null, h('div', { class: 'h3', text: 'Трудные дни' }), rank(hard, 'Трудных дней не было'))),
    ms.length ? h('div', null, h('div', { class: 'h3', text: 'Вехи года' }), rank(ms, '')) : null,
    h('div', { class: 'twocol' },
      tops('Чаще всего в тегах', countTop(list, (e) => e.tags), '#'),
      tops('Чаще всего рядом', countTop(list, (e) => e.people)),
      tops('Чаще всего чувствовали', countTop(list, (e) => e.emotions))));
}

/* ================= Демо-данные (только в базе diary-demo) ================= */
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
async function synthPhoto(rnd, date, mood) {
  const W = 960, H = 720;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  const m = +date.slice(5, 7);
  const season = m === 12 || m <= 2 ? 0 : m <= 5 ? 1 : m <= 8 ? 2 : 3;
  const sky = g.createLinearGradient(0, 0, 0, H * 0.7);
  sky.addColorStop(0, mood >= 5 ? ['#6f9fd8', '#5e98de', '#4a8fe0', '#7a9cc8'][season] : '#8c97ad');
  sky.addColorStop(1, mood >= 6 ? '#f7d9a0' : mood >= 4 ? '#d8e6f3' : '#c0c6d2');
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  if (mood >= 5) { g.fillStyle = 'rgba(255,246,214,.9)'; g.beginPath(); g.arc(150 + rnd() * 660, 120 + rnd() * 120, 48 + rnd() * 20, 0, 7); g.fill(); }
  const pal = [['#eef2f7', '#d7dfea', '#b9c5d6'], ['#a9cf82', '#82b263', '#5f8e4b'], ['#7fb069', '#5a8f4e', '#3d6b3a'], ['#d29a52', '#ad6a33', '#70482b']][season];
  for (let L = 0; L < 3; L++) {
    const base = H * (0.52 + L * 0.13), amp = 30 + rnd() * 40, f = 1.5 + rnd() * 2, ph = rnd() * 6;
    g.fillStyle = pal[L];
    g.beginPath(); g.moveTo(0, H);
    for (let x = 0; x <= W; x += 24) g.lineTo(x, base - Math.sin(x / W * Math.PI * f + ph) * amp - rnd() * 8);
    g.lineTo(W, H); g.closePath(); g.fill();
  }
  const full = await canvasBlob(c, 0.8);
  const th = await drawScaled(c, W, H, 480, 0.78);
  return { blob: full, thumb: th.blob, width: W, height: H };
}
async function generateDemo(onProgress) {
  const rnd = mulberry32(20261014);
  const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
  const chance = (p) => rnd() < p;
  const today = todayStr();
  const start = addDays(today, -365 * 3 + 40);
  const POS = ['Утром долго гуляли по парку, листья шуршат под ногами.', 'Закрыли этап проекта — команда молодцы.', 'Вечером смотрели кино и смеялись до слёз.', 'Съездили на дачу, пожарили шашлык.', 'Получил хорошие новости по работе.', 'Читал новую книгу и не мог оторваться.', 'Наконец-то выспался, весь день бодрость.', 'Приготовил ужин по новому рецепту — получилось отлично.', 'Долгий разговор с близким другом, стало легко.'];
  const MID = ['Обычный рабочий день, много встреч.', 'Разбирал почту и документы.', 'Немного прибрался дома.', 'Съездил в магазин, приготовил ужин.', 'День прошёл ровно, без сюрпризов.', 'Работал из дома, вечером сериал.'];
  const NEG = ['Не выспался, весь день как в тумане.', 'Сорвался срок, пришлось задержаться.', 'Болела голова, рано лёг.', 'Пробки, опоздал на совещание.', 'Поругались по мелочи, неприятный осадок.', 'Навалилось сразу всё, ничего не успел.'];
  const FX = { sport: 'Утром пробежал пять километров.', walk: 'Прошёл пешком через весь район.', overwork: 'Засиделся на работе допоздна.', friends: 'Вечером встретились с друзьями.', family: 'Позвонил родителям, долго говорили.', trip: 'Выбрались за город.', sick: 'Температура, весь день под пледом.' };
  const TITLES = ['Первый снег', 'Поездка в Суздаль', 'День рождения мамы', 'Сдали проект', 'Начало отпуска', 'Концерт любимой группы', 'Прогулка по Коломенскому', 'Тихий вечер с книгой'];
  const MILESTONES = [[80, 'Начал новый проект'], [210, 'Отпуск на Алтае'], [330, 'Купил велосипед'], [470, 'Переезд в новую квартиру'], [600, 'Первый полумарафон'], [720, 'Свадьба друзей'], [830, 'Закончил курс английского'], [960, 'Новая должность'], [1030, 'Поездка в Калининград']];
  const PEOPLE = ['Аня', 'Мама', 'Папа', 'Сергей', 'Коллеги', 'Миша'];
  const out = [], photos = [];
  let d = start, idx = 0;
  while (d < today) {
    const date = parseYmd(d), dow = date.getDay(), weekend = dow === 0 || dow === 6;
    const doy = Math.floor((date - new Date(date.getFullYear(), 0, 0)) / 864e5);
    const ms = MILESTONES.find(([k]) => k === idx);
    const sameDay = d.slice(5) === today.slice(5);
    if (chance(0.8) || ms || sameDay) {
      const f = [];
      if (chance(0.3)) f.push('sport');
      if (chance(0.35)) f.push('walk');
      if (!weekend && chance(0.22)) f.push('overwork');
      if (weekend && chance(0.9)) f.push('dayoff');
      if (chance(weekend ? 0.3 : 0.1)) f.push('friends');
      if (chance(0.25)) f.push('family');
      if (chance(0.04) || (ms && chance(0.5))) f.push('trip');
      if (chance(0.05)) f.push('sick');
      if (weekend && chance(0.12)) f.push('alcohol');
      if (chance(0.3)) f.push('screen');
      const sleep = Math.round(Math.max(4.5, Math.min(10, 7 + (rnd() + rnd() + rnd() - 1.5) * 1.6 + (weekend ? 0.6 : 0) - (f.includes('screen') ? 0.6 : 0))) * 2) / 2;
      let x = 4.4 + 0.55 * Math.sin((doy - 100) / 365 * Math.PI * 2) + (rnd() + rnd() + rnd() - 1.5) * 1.5 + (sleep - 7) * 0.35;
      const eff = { sport: 0.5, walk: 0.3, overwork: -0.8, dayoff: 0.4, friends: 0.7, family: 0.3, trip: 0.9, sick: -1.7, alcohol: -0.2, screen: -0.3 };
      for (const k of f) x += eff[k];
      if (ms) x += 1.5;
      const mood = Math.max(1, Math.min(7, Math.round(x)));
      const tags = [];
      if (!weekend && chance(0.5)) tags.push('работа');
      if (chance(0.15)) tags.push('проект');
      if (weekend && date.getMonth() >= 4 && date.getMonth() <= 8 && chance(0.4)) tags.push('дача');
      if (f.includes('sport') && chance(0.6)) tags.push('спорт');
      if (chance(0.12)) tags.push('книги');
      if (chance(0.08)) tags.push('кино');
      if (chance(0.05)) tags.push('ремонт');
      const people = [];
      if (chance(0.3)) people.push('Аня');
      if (!weekend && chance(0.25)) people.push('Коллеги');
      if (chance(0.12)) people.push(pick(PEOPLE));
      const emoPool = mood >= 6 ? ['Радость', 'Благодарность', 'Вдохновение', 'Любовь', 'Гордость', 'Интерес'] : mood >= 4 ? ['Спокойствие', 'Интерес', 'Усталость', 'Благодарность'] : ['Усталость', 'Тревога', 'Грусть', 'Раздражение', 'Стресс', 'Злость', 'Одиночество'];
      const emotions = [];
      for (let k = 0, n = 1 + Math.floor(rnd() * 2); k < n; k++) addUnique(emotions, pick(emoPool));
      const parts = [pick(mood >= 5 ? POS : mood >= 4 ? MID : NEG)];
      for (const k of f) if (FX[k] && chance(0.5)) parts.push(FX[k]);
      if (chance(0.4)) parts.push(pick(mood >= 5 ? POS : MID));
      const e = blankEntry(d);
      Object.assign(e, { mood, emotions, tags: [...new Set(tags)], people: [...new Set(people)], factors: f, sleep: chance(0.85) ? sleep : null,
        text: [...new Set(parts)].join(' '), title: ms ? ms[1] : (mood >= 6 && chance(0.35) ? pick(TITLES) : ''),
        milestone: !!ms, favorite: !!ms || (mood >= 6 && chance(0.06)),
        createdAt: date.getTime() + 20 * 3600e3, updatedAt: date.getTime() + 20 * 3600e3 });
      out.push(e);
      if (ms || sameDay || (mood >= 5 && chance(0.06)) || chance(0.015)) photos.push(e);
    }
    d = addDays(d, 1); idx++;
  }
  await idb.putMany('entries', out);
  let i = 0;
  for (const e of photos) {
    const n = 1 + (e.milestone ? 2 : chance(0.3) ? 1 : 0);
    for (let k = 0; k < n; k++) {
      const p = await synthPhoto(rnd, e.date, e.mood);
      const id = uid();
      await idbTx(['media', 'thumbs'], 'readwrite', (t) => {
        t.objectStore('media').put({ id, entryId: e.id, kind: 'photo', mime: 'image/jpeg', blob: p.blob, width: p.width, height: p.height, duration: 0, size: p.blob.size, createdAt: e.createdAt });
        t.objectStore('thumbs').put({ id, blob: p.thumb });
      });
      e.media.push({ id, kind: 'photo', duration: 0 });
    }
    onProgress && onProgress(++i / photos.length);
  }
  await idb.putMany('entries', photos);
  meta.lastBackupAt = Date.now();
  await saveMeta();
  for (const e of out) { entries.set(e.id, e); byDate.set(e.date, e); }
  rebuildIndex();
}

function registerSW() {

  navigator.serviceWorker.register('sw.js').then((reg) => {
    const offer = (w) => { updateWorker = w; if (!sheet) renderView(); };
    if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      if (w) w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w); });
    });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
  }).catch(() => {});
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloading) return;
    reloading = true;
    flushSaves().finally(() => location.reload());
  });
}
